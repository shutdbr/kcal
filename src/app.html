<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>kreabot's tracey</title>
		<!-- theme + text size applied before first paint, so a dark-mode
		     reload never flashes the light palette. Mirrors the storage
		     shape in $lib/settings.svelte.ts — change both together. -->
		<script>
			try {
				var s = JSON.parse(localStorage.getItem('tracey-settings') || '{}');
				var t = s.theme || 'system';
				if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.dataset.theme = t;
				var sizes = { small: '56.25%', normal: '62.5%', large: '68.75%', huge: '75%' };
				document.documentElement.style.fontSize = sizes[s.textSize] || '62.5%';
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
